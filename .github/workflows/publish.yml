name: Publish catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Sign catalog
        run: node scripts/sign-catalog.mjs
        env:
          STORE_SIGNING_KEY: ${{ secrets.STORE_SIGNING_KEY }}
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sequence="$(node -p "require('./catalog.json').sequence")"
          gh release create "catalog-${sequence}" catalog.json catalog.envelope.json \
            --latest --title "Store catalog ${sequence}" \
            --notes "Signed Kosmos Store catalog sequence ${sequence}."
